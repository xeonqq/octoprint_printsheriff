[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-PrintSheriff"
version = "0.1.0"
description = "Detect 3D-print failures in timelapse captures with a neural network running locally on the printer host."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "xeonqq", email = "xeonqq@gmail.com" }]
keywords = ["octoprint", "octoprint-plugin", "3d-printing", "spaghetti-detection", "tflite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "OctoPrint>=1.8.0",
    # tflite-runtime wheels are built against the NumPy 1.x C API; NumPy 2 breaks the interpreter.
    "numpy>=1.24,<2",
    "Pillow>=10.0",
    "tflite-runtime>=2.14",
]

[project.urls]
Homepage = "https://github.com/xeonqq/octoprint_printsheriff"
Source = "https://github.com/xeonqq/octoprint_printsheriff"
Issues = "https://github.com/xeonqq/octoprint_printsheriff/issues"

[project.entry-points."octoprint.plugin"]
printsheriff = "octoprint_printsheriff"

[tool.setuptools]
packages = ["octoprint_printsheriff"]
include-package-data = true

[tool.setuptools.package-data]
octoprint_printsheriff = ["templates/*", "static/css/*", "static/js/*", "static/img/*"]